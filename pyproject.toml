[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gal"
version = "0.1.0"
description = "Framework para geração de analisadores léxicos a partir de expressões regulares."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

authors = [
    { name = "Carlos Hayden" },
    { name = "Marina Rosa" },
    { name = "Roberta Piskor" },
]

keywords = [
    "analisador-lexico",
    "compiladores",
    "expressoes-regulares",
    "automatos-finitos",
    "teoria-dos-automatos",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/JunhaumHayden/GeradorAnalisadorLexico"
Repository = "https://github.com/JunhaumHayden/GeradorAnalisadorLexico"
Issues = "https://github.com/JunhaumHayden/GeradorAnalisadorLexico/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
